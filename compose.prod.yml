services:
  nats:
    restart: always
  postgres:
    restart: always
  postgate:
    restart: always
  openworkers-runner:
    restart: always
    volumes:
      - ./inbound-allowlist.txt:/etc/openworkers/inbound-allowlist.txt:ro
    environment:
      - INBOUND_ALLOWLIST_FILE=/etc/openworkers/inbound-allowlist.txt
    ports:
      - 5080:8081
      - 50443:8443
