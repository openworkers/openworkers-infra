services:
  postgres:
    restart: always
  postgate:
    restart: always
  openworkers-runner:
    restart: always
    volumes:
      - ./inbound-allowlist.txt:/etc/openworkers/inbound-allowlist.txt:ro
      - ${HTTP_TLS_CERTIFICATE:?set HTTP_TLS_CERTIFICATE}:/certs/ssl.crt:ro
      - ${HTTP_TLS_KEY:?set HTTP_TLS_KEY}:/certs/ssl.key:ro
    environment:
      - INBOUND_ALLOWLIST_FILE=/etc/openworkers/inbound-allowlist.txt
      - WORKER_DOMAINS=workers.rocks
      - ISOLATE_HEAP_MAX_MB=512
      # Cloudflare gives the client address; only its ranges can connect
      - CLIENT_IP_HEADER=cf-connecting-ip
      - HTTP_TLS_CERTIFICATE=/certs/ssl.crt
      - HTTP_TLS_KEY=/certs/ssl.key
    # IPv4 only: Docker gives an IPv6 peer the address of its gateway, and
    # the allowlist would refuse it
    ports:
      - 0.0.0.0:443:8443
