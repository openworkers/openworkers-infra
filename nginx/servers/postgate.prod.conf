upstream postgate_server {
  server postgate:6080;
  keepalive 16;
}

server {
  listen 443 ssl; http2 on;
  server_name postgate.dev.kube postgate.dev.localhost postgate.openworkers.dev postgate.openworkers.com;

  set $sid 'postgate';

  # SSL configuration
  include rules/ssl.conf;

  # Proxy to Postgate
  location / {
    add_header X-Matching-Path  postgate   always;
    add_header X-Request-Id     $rid       always;
    add_header X-Server-Id      $sid       always;
    add_header X-Proxy-Name     $hostname  always;

    include rules/proxy.conf;
    proxy_pass http://postgate_server;
  }
}
