volumes:
  postgres_data:
  # D1 databases: one SQLite file each. Snapshots go to D1_ARCHIVE_* (.env)
  runner_d1:

services:
  # Postgres
  postgres:
    image: postgres:15.1-alpine3.17
    volumes:
      - postgres_data:/var/lib/postgresql/data:rw
    env_file:
      - .env
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready --quiet --username=$POSTGRES_USER --dbname=$POSTGRES_DB",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Postgate (HTTP proxy for Postgres)
  # Uses OpenWorkers database via views (postgate_databases, postgate_tokens)
  postgate:
    image: ghcr.io/openworkers/postgate:v0.1.6
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
      - RUST_LOG=postgate=info
      - POSTGATE_HOST=0.0.0.0
      - POSTGATE_PORT=6080
      - POSTGATE_SKIP_MIGRATIONS=true
    depends_on:
      - postgres

  # OpenWorkers Runner
  openworkers-runner:
    image: ghcr.io/openworkers/openworkers-runner:v1.18.5-v8-telemetry
    env_file:
      - .env
    environment:
      - RUST_LOG=info,openworkers_runner=debug,openworkers_runtime_v8=debug
      - OTLP_SERVICE_NAME=openworkers-runner
      - DB_TEST_BEFORE_ACQUIRE=false
      - HTTP_ADDR=0.0.0.0:8081
      - HTTPS_ADDR=0.0.0.0:8443
      - HTTP_TLS_CERTIFICATE=
      - HTTP_TLS_KEY=
      - D1_DATA_DIR=/var/lib/openworkers/d1
    volumes:
      - runner_d1:/var/lib/openworkers/d1
    depends_on:
      - postgres
    deploy:
      replicas: 1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/health || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
