networks:
  default:
  signoz-net:
    external: true

services:
  # Every service that exports over OTLP needs to reach the collector by name.
  openworkers-runner:
    networks:
      - default
      - signoz-net

  openworkers-logs:
    networks:
      - default
      - signoz-net

  openworkers-scheduler:
    networks:
      - default
      - signoz-net
